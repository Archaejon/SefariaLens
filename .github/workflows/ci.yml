# The GitHub counterpart of .woodpecker.yml: every push and pull request runs
# the test suite, and a tag v<version> additionally packages the Windows
# portable exe and publishes it as a release. A manual run packages the exe
# too, but keeps it as a workflow artifact instead of releasing it, so the
# build can be checked without cutting a version.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group so a manual run on main does not cancel the
  # push build of the same commit.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A release in progress is never cancelled halfway through an upload.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests run on Node alone; the Electron binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The renderer is linted without cross-file name resolution, so this
      # still earns its place: no test loads those files either.
      - name: Syntax check
        run: |
          git ls-files '*.js' | while read -r file; do node --check "$file"; done
      - run: npm test

  build-portable:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # A Windows runner builds the NSIS-based portable exe natively, so there is
    # no Wine layer between the build and the thing users run.
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The artefact is named after package.json, so a tag that disagrees with
      # it would publish a file whose name lies about its contents.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run dist

      # Launch what was just built, before anything is published. The app runs
      # headless, drives its own reader, commentaries, library and notebook,
      # and exits non-zero if any of it is broken. It reads the live Sefaria
      # API, so one failure gets a second attempt before the build is failed.
      - name: Smoke-test the packaged app
        shell: pwsh
        timeout-minutes: 12
        run: |
          $exe = Join-Path $PWD 'dist/win-unpacked/Sefaria Lens.exe'
          $env:SEFARIA_LENS_SMOKE = '1'
          $env:SEFARIA_LENS_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $ok = $false
          foreach ($attempt in 1..2) {
            $env:SEFARIA_LENS_USER_DATA = Join-Path $env:RUNNER_TEMP "smoke-profile-$attempt"
            Remove-Item $env:SEFARIA_LENS_SMOKE_OUT -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -PassThru -Wait
            Write-Host "attempt $attempt exited with code $($p.ExitCode)"
            if (Test-Path $env:SEFARIA_LENS_SMOKE_OUT) { Get-Content $env:SEFARIA_LENS_SMOKE_OUT }
            if ($p.ExitCode -eq 0) { $ok = $true; break }
          }
          if (-not $ok) { exit 1 }

      - name: Checksums
        run: |
          cd dist
          ls -l SefariaLens-*-portable.exe
          # Git Bash marks binary mode with "*"; write the plain two-space form
          # every sha256sum -c accepts.
          sha256sum SefariaLens-*-portable.exe | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SefariaLens-portable
          path: |
            dist/SefariaLens-*-portable.exe
            dist/SHA256SUMS.txt
          retention-days: 7

      # The annotated tag already carries the release notes, so they are taken
      # from there instead of being duplicated in a file that drifts.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout leaves a lightweight stand-in for the tag; fetch the real one.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "$notes" ]; then notes=$(git log -1 --format='%B'); fi
          printf '%s\n' "$notes" > dist/release-notes.md
          # Re-running a tag build repairs a half-finished release rather than
          # failing because it already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/SefariaLens-*-portable.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/SefariaLens-*-portable.exe dist/SHA256SUMS.txt \
              --title "Sefaria Lens $GITHUB_REF_NAME" --notes-file dist/release-notes.md --verify-tag
          fi
