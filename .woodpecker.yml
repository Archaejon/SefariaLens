# Push and pull request builds run the test suite on Node 22, the same major
# version the app is developed against. Tag builds additionally package the
# Windows portable exe and publish it, so a release is produced by CI rather
# than by whoever happens to have a Windows machine.
when:
  - event: [push, pull_request, manual, tag]

steps:
  test:
    image: node:22-bookworm
    environment:
      # Tests run on Node alone; the Electron binary is not needed in CI.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    commands:
      - node --version
      - npm ci
      - npm test

  build-portable:
    # Wine lets electron-builder produce the NSIS-based portable exe on Linux.
    # The tag is pinned to a Node version so cross-builds are reproducible.
    image: electronuserland/builder:22-wine
    depends_on: [test]
    when:
      - event: tag
    environment:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_CACHE: /root/.cache/electron
      ELECTRON_BUILDER_CACHE: /root/.cache/electron-builder
    commands:
      - node --version
      # The artefact is named after package.json, so a tag that disagrees with
      # it would publish a file whose name lies about its contents.
      - |
        version="v$(node -p 'require("./package.json").version')"
        if [ "$CI_COMMIT_TAG" != "$version" ]; then
          echo "tag $CI_COMMIT_TAG does not match package.json version $version" >&2
          exit 1
        fi
      - npm ci
      - npm run dist
      - ls -l dist/*.exe
      - |
        cd dist
        sha256sum SefariaLens-*-portable.exe > SHA256SUMS.txt
        cat SHA256SUMS.txt
      # The annotated tag already carries the release notes, so they are taken
      # from there instead of being duplicated in a file that drifts.
      - |
        cd "${CI_WORKSPACE:-.}"
        notes=""
        if command -v git >/dev/null 2>&1; then
          git fetch --tags --force origin >/dev/null 2>&1 || true
          notes=$(git tag -l --format='%(contents)' "$CI_COMMIT_TAG")
          if [ -z "$notes" ]; then notes=$(git log -1 --format='%B'); fi
        fi
        if [ -z "$notes" ]; then notes="${CI_COMMIT_MESSAGE:-Sefaria Lens $CI_COMMIT_TAG}"; fi
        printf '%s\n' "$notes" > dist/release-notes.md
        printf 'Sefaria Lens %s\n' "$CI_COMMIT_TAG" > dist/release-title.txt
        head -3 dist/release-notes.md

  release:
    image: woodpeckerci/plugin-release
    depends_on: [build-portable]
    when:
      - event: tag
    settings:
      # Forgejo/Codeberg token with write:repository (and read:misc on 1.20+).
      api_key:
        from_secret: codeberg_release_token
      base_url: https://codeberg.org
      # Written by the build step rather than relying on env expansion in settings.
      title: dist/release-title.txt
      note: dist/release-notes.md
      files:
        - dist/SefariaLens-*-portable.exe
        - dist/SHA256SUMS.txt
      # Re-running a tag pipeline should repair a half-finished release rather
      # than fail because the asset is already there.
      file_exists: overwrite
      draft: false
      prerelease: false
